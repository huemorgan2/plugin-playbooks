name = "plugin-playbooks"
version = "0.51.0"
description = "Durable multi-step playbooks — Luna builds them, triggers fire them."
entry = "plugin_playbooks"
sdk_version = "0"
license = "MIT"
category = "system"
db_tables = ["playbooks", "playbook_versions", "playbook_edit_tickets", "playbook_runs", "playbook_step_runs", "playbook_probe_results", "playbook_drafts", "playbook_fix_proposals", "playbook_delegations", "playbook_watches", "playbook_journal"]
tags = ["playbooks", "workflows", "automation", "triggers"]
readme = """
# plugin-playbooks

The **Playbooks engine** for Luna: durable, multi-step agent workflows.
Playbooks are reusable pblang templates of steps (tool calls, LLM steps, agent
decisions, loops, branches, waits) that Luna authors through conversation and
executes on triggers or on demand.

Adds a **Playbooks** sidebar section with a full visual canvas (react-flow):
list → canvas/code editor → run replay with per-step state visualization.
Served as a full-pane iframe from the plugin's own prebuilt `ui/` dist; live
agent edits stream in over the E12 `ui.plugin.event` bridge (`playbook.open`,
`playbook.patch`, `navigate`), and run/step activity rides the `activity.*`
SSE feed.

Owns its **DB tables via the SDK** (E4 isolated metadata) and binds
external trigger sources (cron, webhooks, connector events) through the SDK
`TriggerSourceRegistry`. Chat messages sent from playbook runs are tagged
`source=playbook` (E11) for generic badging in core. Imports only `luna_sdk`
+ stdlib + SQLAlchemy — zero `luna.*` imports.

Extracted from Luna core in 009.001 (Luna ≥ 0.29). History lives in the main
luna repo up to 0.29.006; source: https://github.com/huemorgan2/plugin-playbooks
"""

[requires]
tools = 25
tables = 11

# plans/018 phase 3: this list is generated from the ToolDefs in
# agent_tools.build_tools + delegation.build_delegation_tools and pinned by
# tests/test_manifest_drift.py — edit the code, then this file, or the drift
# test fails.

[[tools]]
name = "playbook_propose"
description = "Save a new playbook as a validated candidate from python or pblang source — nothing runs live until playbook_publish."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_list"
description = "List available playbooks."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_run"
description = "Execute the LIVE version of a playbook for real; inputs are typed at intake and a compute failure is reported as one readable line."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_status"
description = "Get the full step/effect trace of a playbook run, with error, error_type, traceback and failed_at."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_cancel"
description = "Cancel a running playbook."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_watch"
description = "Wake me when an existing playbook's next run finishes (one-shot)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_watch_cancel"
description = "Cancel this chat's active playbook_watch on a playbook."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_set_autonomy"
description = "Change per-playbook run/publish autonomy and publish gates (owner approval)."
policy = "prompt_always"
risk_level = "medium"

[[tools]]
name = "playbook_ack_failures"
description = "Acknowledge production failures so the digest stops repeating them."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_get_definition"
description = "Get the source (python or pblang) or JSON definition of a playbook version."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_versions"
description = "List every stored version of a playbook with content/run summary."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_version_read"
description = "Full read of any stored version: code, manifest, recent runs."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_version_diff"
description = "Unified diff of code + manifest between two stored versions."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_runs"
description = "List a playbook's runs with full failure output (error, error_type, failed_at); filter by version/status."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_validate"
description = "Statically check python or pblang playbook source without saving or running it."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_language_reference"
description = "Return the pblang language reference."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_dry_run"
description = "Simulate a playbook run with every effect stubbed (scriptable via stubs) — no side effects; python playbooks dry-run on the segment loop, pblang on the step graph."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_edit"
description = "Edit a playbook's candidate version in its stored format (read-stage ticket flow; a rejected write keeps the ticket)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_manifest_set"
description = "Set or replace a playbook's manifest — context, not law; update it when it goes stale."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_publish"
description = "Promote a green candidate to live — gates + ONE explained owner approval."
policy = "auto_approve"
risk_level = "medium"

[[tools]]
name = "playbook_rollback"
description = "Restore the previous live version — gates + ONE explained owner approval."
policy = "auto_approve"
risk_level = "medium"

[[tools]]
name = "playbook_run_candidate"
description = "Test-run the candidate version for real (owner approval); inputs typed at intake, failures reported as one readable line."
policy = "prompt_always"
risk_level = "medium"

[[tools]]
name = "playbook_preflight"
description = "Probe a playbook's external dependencies without side effects."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "playbook_agent"
description = "Delegate a playbook authoring job to a focused background agent with a live progress card."
policy = "auto_approve"
risk_level = "medium"

[[tools]]
name = "playbook_agent_status"
description = "Check a delegation started by playbook_agent."
policy = "auto_approve"
risk_level = "low"
